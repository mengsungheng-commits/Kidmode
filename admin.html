<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KidsMode Fleet Control Panel</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 520px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            padding: 24px;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .header h1 {
            font-size: 1.5rem;
            margin: 0 0 6px 0;
            color: var(--primary);
        }
        .header p {
            font-size: 0.85rem;
            color: #6b7280;
            margin: 0;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #374151;
        }
        input, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.95rem;
            box-sizing: border-box;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        .toggle-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f9fafb;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            margin-bottom: 16px;
        }
        .toggle-card label {
            margin: 0;
            cursor: pointer;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .3s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: var(--primary);
        }
        input:checked + .slider:before {
            transform: translateX(20px);
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }
        .btn:hover {
            background: var(--primary-hover);
        }
        .btn-secondary {
            background: #4b5563;
        }
        .btn-secondary:hover {
            background: #374151;
        }
        #status {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
        }
        .success { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
        .error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
        .info { background: #e0f2fe; color: #075985; border: 1px solid #bae6fd; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📱 KidsMode Fleet Control</h1>
        <p>Manage PINs & Auto-Updates for all tablets</p>
    </div>

    <div class="form-group">
        <label for="githubToken">GitHub Access Token (Saved locally):</label>
        <input type="password" id="githubToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
    </div>

    <hr style="border: 0; border-top: 1px solid #e5e7eb; margin: 20px 0;">

    <div class="form-group">
        <label for="teacherPin">Teacher Mode PIN (4 Digits):</label>
        <input type="text" id="teacherPin" maxlength="4" placeholder="2025">
    </div>

    <div class="form-group">
        <label for="versionCode">Version Code:</label>
        <input type="number" id="versionCode" placeholder="24">
    </div>

    <div class="form-group">
        <label for="versionName">Version Name:</label>
        <input type="text" id="versionName" placeholder="1.0.24">
    </div>

    <div class="form-group">
        <label for="apkUrl">APK Download URL:</label>
        <input type="text" id="apkUrl" value="https://raw.githubusercontent.com/mengsungheng-commits/Kidmode/main/Kidsmode.apk">
    </div>

    <div class="toggle-card">
        <label for="enabled">Enable Auto-Update Flag</label>
        <label class="switch">
            <input type="checkbox" id="enabled" checked>
            <span class="slider"></span>
        </label>
    </div>

    <div class="form-group">
        <label for="scheduledTime">Scheduled Update Time (Optional UTC: YYYY-MM-DD HH:mm):</label>
        <input type="text" id="scheduledTime" placeholder="2025-03-30 02:00">
    </div>

    <div class="form-group">
        <label for="notes">Release Notes:</label>
        <textarea id="notes" rows="2" placeholder="Automatic update release"></textarea>
    </div>

    <button class="btn" onclick="pushConfig()">🚀 PUSH TO ALL TABLETS</button>
    <button class="btn btn-secondary" onclick="loadCurrentConfig()">🔄 Load Current Config</button>

    <div id="status"></div>
</div>

<script>
    const REPO_OWNER = 'mengsungheng-commits';
    const REPO_NAME = 'Kidmode';
    const FILE_PATH = 'version.json';
    let fileSha = '';

    // Load saved GitHub token from localStorage
    document.addEventListener('DOMContentLoaded', () => {
        const savedToken = localStorage.getItem('km_github_token');
        if (savedToken) {
            document.getElementById('githubToken').value = savedToken;
        }
        loadCurrentConfig();
    });

    function showStatus(msg, type) {
        const el = document.getElementById('status');
        el.className = type;
        el.innerText = msg;
        el.style.display = 'block';
    }

    async function loadCurrentConfig() {
        showStatus('Fetching current config from GitHub...', 'info');
        try {
            const res = await fetch(`https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/${FILE_PATH}?t=${Date.now()}`);
            if (!res.ok) throw new Error('Could not fetch file');
            const data = await res.json();

            document.getElementById('teacherPin').value = data.teacherPin || data.teacher_pin || '2025';
            document.getElementById('versionCode').value = data.versionCode || 24;
            document.getElementById('versionName').value = data.versionName || '1.0.24';
            document.getElementById('apkUrl').value = data.apkUrl || '';
            document.getElementById('enabled').checked = data.enabled !== false;
            document.getElementById('scheduledTime').value = data.scheduledTime || '';
            document.getElementById('notes').value = data.notes || '';

            // Also fetch SHA for updating via API
            const token = document.getElementById('githubToken').value.trim();
            if (token) {
                const apiRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                if (apiRes.ok) {
                    const apiData = await apiRes.json();
                    fileSha = apiData.sha;
                }
            }
            showStatus('Current config loaded successfully!', 'success');
        } catch (err) {
            showStatus('Loaded default config. (Add GitHub Token to save changes directly)', 'info');
        }
    }

    async function pushConfig() {
        const token = document.getElementById('githubToken').value.trim();
        if (!token) {
            showStatus('Please enter your GitHub Access Token to save and push changes.', 'error');
            return;
        }

        localStorage.setItem('km_github_token', token);
        showStatus('Publishing update to all tablets...', 'info');

        const newConfig = {
            versionCode: parseInt(document.getElementById('versionCode').value, 10) || 24,
            versionName: document.getElementById('versionName').value.trim() || '1.0.24',
            apkUrl: document.getElementById('apkUrl').value.trim(),
            notes: document.getElementById('notes').value.trim(),
            teacherPin: document.getElementById('teacherPin').value.trim(),
            enabled: document.getElementById('enabled').checked,
            scheduledTime: document.getElementById('scheduledTime').value.trim()
        };

        const jsonString = JSON.stringify(newConfig, null, 2);
        const encodedContent = btoa(unescape(encodeURIComponent(jsonString)));

        try {
            // Get current file SHA if not loaded
            if (!fileSha) {
                const getRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                if (getRes.ok) {
                    const getJson = await getRes.json();
                    fileSha = getJson.sha;
                }
            }

            const payload = {
                message: `Update remote config: PIN ${newConfig.teacherPin}, Version ${newConfig.versionCode}`,
                content: encodedContent,
                sha: fileSha
            };

            const putRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            if (putRes.ok) {
                const resJson = await putRes.json();
                fileSha = resJson.content.sha;
                showStatus('✅ SUCCESS! New PIN & Update pushed to all tablets!', 'success');
            } else {
                const errData = await putRes.json();
                showStatus(`Failed to push: ${errData.message || 'Invalid Token or Permission Error'}`, 'error');
            }
        } catch (err) {
            showStatus(`Error: ${err.message}`, 'error');
        }
    }
</script>
</body>
</html>
